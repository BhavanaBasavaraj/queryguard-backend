# Local development dependencies for QueryGuard.
# The application itself runs on the host (uvicorn --reload); this file
# provides the services it talks to.
name: queryguard

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-queryguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-queryguard}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  dynamodb:
    image: amazon/dynamodb-local:2.5.2
    # -sharedDb keeps one database file for all credentials and regions.
    # Without it, each credential pair gets its own isolated store and
    # tables appear to vanish between clients.
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/data"]
    working_dir: /home/dynamodblocal
    user: root
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - dynamodata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  dynamodata:
